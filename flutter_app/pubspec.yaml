name: truck_rescue_india
description: "TRUCK RESCUE INDIA - 24x7 Heavy Commercial Vehicle Highway Breakdown & Mechanic Network"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase Suite
  firebase_core: ^2.32.0
  firebase_auth: ^4.19.7
  cloud_firestore: ^4.17.5
  firebase_storage: ^11.7.7
  firebase_messaging: ^14.9.4

  # State Management & Architecture
  provider: ^6.1.2

  # Location & Maps
  geolocator: ^12.0.0
  google_maps_flutter: ^2.6.1

  # Network & Hardware Integration
  url_launcher: ^6.3.0
  image_picker: ^1.1.1
  http: ^1.2.1

  # Utilities & UI
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  flutter_spinkit: ^5.2.1
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" stroke="#ea580c" stroke-width="12" />
  
  <!-- Tricolor Highway Stripe -->
  <path d="M 60 400 L 452 400" stroke="#f97316" stroke-width="12" stroke-linecap="round" />
  <path d="M 60 420 L 452 420" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
  <path d="M 60 440 L 452 440" stroke="#16a34a" stroke-width="12" stroke-linecap="round" />

  <!-- Heavy Truck Silhouette & Wrench -->
  <!-- Cab -->
  <path d="M 120 340 L 120 220 L 260 220 L 320 280 L 380 280 L 380 340 Z" fill="#2563eb" />
  <!-- Windshield -->
  <path d="M 260 235 L 310 280 L 260 280 Z" fill="#38bdf8" />
  <!-- Wheels -->
  <circle cx="170" cy="340" r="38" fill="#1e293b" stroke="#f97316" stroke-width="10" />
  <circle cx="170" cy="340" r="15" fill="#f8fafc" />
  
  <circle cx="340" cy="340" r="38" fill="#1e293b" stroke="#f97316" stroke-width="10" />
  <circle cx="340" cy="340" r="15" fill="#f8fafc" />

  <!-- Emergency Beacon -->
  <rect x="230" y="195" width="40" height="25" rx="8" fill="#ea580c" />
  <circle cx="250" cy="207" r="8" fill="#fef08a" />

  <!-- Cross Wrench in Corner -->
  <circle cx="390" cy="140" r="55" fill="#ea580c" />
  <path d="M 370 120 L 410 160 M 410 120 L 370 160" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
</svg>
